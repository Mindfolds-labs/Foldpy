[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foldpy"
version = "0.6.0"
description = "Structural visual transformation engine for tensors, geometry, scale, projection and approximate lifting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Mindfolds Labs" }
]
keywords = ["computer-vision", "geometry", "tensor", "scientific-computing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/Mindfolds-labs/Foldpy"
Repository = "https://github.com/Mindfolds-labs/Foldpy"
Documentation = "https://github.com/Mindfolds-labs/Foldpy/tree/main/docs"
Changelog = "https://github.com/Mindfolds-labs/Foldpy/releases"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "build>=1.2.1",
  "twine>=5.0.0",
  "ruff>=0.6.0",
]
vision = ["pillow>=10.0"]
torch = ["torch>=2.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["foldpy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
