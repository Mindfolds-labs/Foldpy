[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foldpy"
version = "0.5.0"
description = "Structural visual transformation engine for tensors, geometry, scale, projection and approximate lifting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Seu Nome" }
]
dependencies = [
  "numpy>=1.24"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "build>=1.2.1",
  "twine>=5.0.0"
]
vision = [
  "pillow>=10.0"
]
torch = [
  "torch>=2.0"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["foldpy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
